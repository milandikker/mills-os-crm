{% extends "base.html" %}
{% block content %}

<form method="post" enctype="multipart/form-data" class="new-form">
  <label>
    Platform
    <select name="platform" id="platform" required>
      <option value="" disabled selected>Choose one</option>
      {% for platform in platform_content_types %}
        <option value="{{ platform }}">{{ platform | capitalize }}</option>
      {% endfor %}
    </select>
  </label>

  <label>
    Content type
    <select name="content_type" id="content_type" required>
      <option value="" disabled selected>Choose a platform first</option>
    </select>
  </label>

  <label>
    Schedule for
    <input type="datetime-local" id="scheduled_for_local" required>
    <span class="hint">Shown in your local time -- the Telegram bot notifies you once this time arrives.</span>
  </label>
  <input type="hidden" name="scheduled_for" id="scheduled_for_hidden">

  <label>
    Caption
    <textarea name="caption" rows="6" required placeholder="Write the caption..."></textarea>
  </label>

  <label>
    Upload media
    <span class="hint" id="media-hint">One video (Reel/TikTok video), or one or more photos for a carousel post</span>
    <input type="file" name="media_file" id="media_file" accept="image/*,video/mp4,video/quicktime" multiple>
    <span class="hint" id="file-count"></span>
  </label>

  <p class="or-divider">-- or --</p>

  <label>
    Paste a media URL instead
    <input type="url" name="media_url" placeholder="https://...">
  </label>

  <label>
    Media note <span class="hint">(optional, e.g. "[video would go here]")</span>
    <input type="text" name="media_note">
  </label>

  <button type="submit" class="button" id="save-btn">Save draft</button>
</form>

<script>
var contentTypesByPlatform = {{ platform_content_types | tojson }};
var platformSelect = document.getElementById("platform");
var contentTypeSelect = document.getElementById("content_type");
var mediaFileInput = document.getElementById("media_file");
var fileCountLabel = document.getElementById("file-count");
var scheduledLocalInput = document.getElementById("scheduled_for_local");
var scheduledHiddenInput = document.getElementById("scheduled_for_hidden");

// Default to "right now" in the browser's local time, still editable.
(function () {
  var now = new Date();
  scheduledLocalInput.value = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
    .toISOString()
    .slice(0, 16);
})();

platformSelect.addEventListener("change", function () {
  var options = contentTypesByPlatform[platformSelect.value] || [];
  contentTypeSelect.innerHTML = "";
  options.forEach(function (value) {
    var opt = document.createElement("option");
    opt.value = value;
    opt.textContent = value;
    contentTypeSelect.appendChild(opt);
  });
});

mediaFileInput.addEventListener("change", function () {
  var n = mediaFileInput.files.length;
  if (n === 0) {
    fileCountLabel.textContent = "";
  } else if (n === 1) {
    fileCountLabel.textContent = "1 file selected";
  } else {
    fileCountLabel.textContent = n + " files selected (carousel)";
  }
});

document.querySelector(".new-form").addEventListener("submit", function () {
  // Convert the local wall-clock time the user picked into an
  // unambiguous UTC ISO string before it hits the server.
  scheduledHiddenInput.value = new Date(scheduledLocalInput.value).toISOString();

  var btn = document.getElementById("save-btn");
  btn.disabled = true;
  btn.textContent = "Saving... (can take a while over the tunnel for large files)";
});
</script>
{% endblock %}
